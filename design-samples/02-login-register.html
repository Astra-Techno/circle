<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>CIRCLE - Login / Register</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --primary: #050c25; --primary-light: #1b223c;
    --secondary: #5753ac; --secondary-light: #a29efd;
    --coral: #de6751; --coral-light: #ffb4a6;
    --surface: #f9f9ff; --surface-dim: #d3daea;
    --surface-container: #e7eeff; --surface-container-low: #f0f3ff;
    --surface-high: #e2e8f9; --surface-highest: #dce2f3;
    --on-surface: #151c27; --on-surface-variant: #46464d;
    --outline: #76767e; --outline-variant: #c6c6ce;
    --error: #ba1a1a;
    --font: 'Plus Jakarta Sans', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font); background: var(--surface); color: var(--on-surface);
    max-width: 430px; margin: 0 auto; min-height: 100dvh;
    display: flex; flex-direction: column;
  }

  /* Top brand bar */
  .brand-bar {
    padding: 48px 24px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .brand-logo {
    width: 40px; height: 40px;
    background: var(--secondary);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-logo svg { width: 22px; height: 22px; }
  .brand-name { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; }

  /* Tab switcher */
  .tabs {
    display: flex; margin: 0 24px; gap: 0;
    border-bottom: 1.5px solid var(--outline-variant);
  }
  .tab {
    flex: 1; padding: 12px 0; text-align: center;
    font-size: 15px; font-weight: 600;
    color: var(--on-surface-variant);
    border: none; background: none; cursor: pointer;
    font-family: var(--font);
    position: relative;
    transition: color 0.2s;
  }
  .tab.active { color: var(--primary); }
  .tab.active::after {
    content: ''; position: absolute;
    bottom: -1.5px; left: 16px; right: 16px; height: 2.5px;
    background: var(--primary); border-radius: 2px;
  }

  /* Form area */
  .form-area { flex: 1; padding: 28px 24px; }
  .form-title {
    font-size: 24px; font-weight: 700; line-height: 1.2;
    letter-spacing: -0.01em; margin-bottom: 6px;
  }
  .form-subtitle {
    font-size: 14px; color: var(--on-surface-variant);
    line-height: 1.5; margin-bottom: 24px;
  }

  .field { margin-bottom: 16px; }
  .field-label {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--on-surface); margin-bottom: 6px;
  }
  .field-row { display: flex; gap: 8px; }
  .field-input {
    width: 100%; height: 52px; padding: 0 16px;
    background: #fff; border: 1.5px solid var(--outline-variant);
    border-radius: 14px; font-family: var(--font);
    font-size: 16px; color: var(--on-surface);
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(87,83,172,0.12);
  }
  .field-input::placeholder { color: var(--outline); }
  .field-input.country-code {
    width: 110px; flex-shrink: 0;
    text-align: center; font-size: 15px;
    background: var(--surface-container-low);
  }

  /* Password field with eye toggle */
  .password-wrapper {
    position: relative;
  }
  .password-wrapper .field-input { padding-right: 48px; }
  .eye-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border: none; background: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--outline); border-radius: 8px;
    transition: color 0.15s;
  }
  .eye-toggle:hover { color: var(--on-surface); }

  .field-hint {
    font-size: 12px; color: var(--on-surface-variant);
    margin-top: 4px; padding-left: 4px;
  }

  .forgot-link {
    display: block; text-align: right;
    font-size: 13px; font-weight: 600;
    color: var(--secondary); text-decoration: none;
    margin-top: -8px; margin-bottom: 20px;
  }

  /* Submit button */
  .btn-submit {
    width: 100%; height: 54px;
    background: var(--primary); color: #fff;
    border: none; border-radius: 16px;
    font-family: var(--font); font-size: 16px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 16px rgba(5,12,37,0.2);
    transition: transform 0.15s, box-shadow 0.15s;
    margin-top: 8px;
  }
  .btn-submit:active { transform: scale(0.97); }

  /* Divider */
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 24px 0;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px;
    background: var(--outline-variant);
  }
  .divider span { font-size: 12px; font-weight: 500; color: var(--outline); text-transform: uppercase; letter-spacing: 0.05em; }

  /* Social buttons */
  .social-buttons { display: flex; gap: 12px; }
  .btn-social {
    flex: 1; height: 50px;
    background: #fff; border: 1.5px solid var(--outline-variant);
    border-radius: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: var(--font); font-size: 14px; font-weight: 600;
    color: var(--on-surface);
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-social:hover { background: var(--surface-container-low); border-color: var(--outline); }
  .btn-social svg { width: 20px; height: 20px; }

  .bottom-text {
    text-align: center; padding: 20px 24px 32px;
    font-size: 14px; color: var(--on-surface-variant);
  }
  .bottom-text a { color: var(--secondary); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>

<div class="brand-bar">
  <div class="brand-logo">
    <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
      <path d="M12 28c-4-6 0-14 8-14s8 6 8 10-4 10-8 10c4 0 8 2 8 10s-4 10-8 10-12-8-8-14"/>
    </svg>
  </div>
  <span class="brand-name">CIRCLE</span>
</div>

<div class="tabs">
  <button class="tab active">Log In</button>
  <button class="tab">Register</button>
</div>

<div class="form-area">
  <h2 class="form-title">Welcome back</h2>
  <p class="form-subtitle">Sign in to reconnect with your circles and see what's new.</p>

  <div class="field">
    <label class="field-label">Mobile number</label>
    <div class="field-row">
      <input class="field-input country-code" value="+91" readonly/>
      <input class="field-input" type="tel" placeholder="Enter your number"/>
    </div>
  </div>

  <div class="field">
    <label class="field-label">Password</label>
    <div class="password-wrapper">
      <input class="field-input" type="password" placeholder="Enter password"/>
      <button class="eye-toggle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>

  <a href="#" class="forgot-link">Forgot password?</a>

  <button class="btn-submit">
    Sign In
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
  </button>

  <div class="divider"><span>or continue with</span></div>

  <div class="social-buttons">
    <button class="btn-social">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Google
    </button>
    <button class="btn-social">
      <svg viewBox="0 0 24 24" fill="#000"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
      Apple
    </button>
  </div>
</div>

<p class="bottom-text">Don't have an account? <a href="#">Create one</a></p>

</body>
</html>
