<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>CIRCLE - Events</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --primary: #050c25; --secondary: #5753ac; --secondary-light: #a29efd;
    --coral: #de6751; --teal: #3e978b;
    --surface: #f9f9ff; --surface-container-low: #f0f3ff;
    --surface-high: #e2e8f9; --on-surface: #151c27;
    --on-surface-variant: #46464d; --outline: #76767e; --outline-variant: #c6c6ce;
    --font: 'Plus Jakarta Sans', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--surface); color: var(--on-surface); max-width: 430px; margin: 0 auto; min-height: 100dvh; padding-bottom: 80px; }

  .app-bar { position: sticky; top: 0; z-index: 10; padding: 12px 20px; background: rgba(249,249,255,0.92); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(198,198,206,0.4); }
  .app-bar h1 { font-size: 22px; font-weight: 800; }
  .icon-btn { width: 40px; height: 40px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--on-surface); }

  /* Calendar strip */
  .calendar-strip {
    display: flex; gap: 4px; padding: 12px 20px;
    overflow-x: auto; scrollbar-width: none;
  }
  .calendar-strip::-webkit-scrollbar { display: none; }
  .cal-day {
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 12px; border-radius: 14px; min-width: 48px;
    cursor: pointer; border: none; background: none;
    font-family: var(--font); transition: all 0.15s;
  }
  .cal-day .day-name { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); margin-bottom: 4px; }
  .cal-day .day-num { font-size: 16px; font-weight: 700; color: var(--on-surface); }
  .cal-day.active { background: var(--primary); }
  .cal-day.active .day-name, .cal-day.active .day-num { color: #fff; }
  .cal-day.has-event .day-num::after {
    content: ''; display: block; width: 5px; height: 5px;
    background: var(--coral); border-radius: 50%;
    margin: 3px auto 0;
  }
  .cal-day.active.has-event .day-num::after { background: var(--coral-light, #ffb4a6); }

  .section-label { padding: 12px 20px 8px; font-size: 12px; font-weight: 600; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.06em; }

  /* Event cards */
  .event-card {
    margin: 6px 20px;
    background: #fff;
    border-radius: 16px;
    border: 1px solid var(--outline-variant);
    overflow: hidden;
    display: flex;
    cursor: pointer;
    transition: box-shadow 0.2s;
  }
  .event-card:hover { box-shadow: 0 4px 16px rgba(5,12,37,0.08); }

  .event-date-badge {
    width: 64px; min-height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 12px 8px;
    flex-shrink: 0;
  }
  .edb-default { background: var(--surface-container-low); }
  .edb-today { background: var(--secondary); }
  .edb-upcoming { background: var(--coral); }
  .event-date-badge .month { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  .event-date-badge .day { font-size: 24px; font-weight: 800; line-height: 1.1; }
  .edb-default .month, .edb-default .day { color: var(--on-surface); }
  .edb-today .month, .edb-today .day, .edb-upcoming .month, .edb-upcoming .day { color: #fff; }

  .event-body { flex: 1; padding: 12px 14px; min-width: 0; }
  .event-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .event-detail {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--on-surface-variant);
    margin-bottom: 3px;
  }
  .event-detail svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--outline); }
  .event-group-tag {
    display: inline-block; margin-top: 6px;
    padding: 3px 8px; border-radius: 6px;
    background: var(--surface-container-low);
    font-size: 11px; font-weight: 600; color: var(--secondary);
  }

  .event-rsvp {
    display: flex; align-items: center;
    padding: 0 14px 0 0;
    flex-shrink: 0;
  }
  .rsvp-btn {
    padding: 6px 14px; border-radius: 10px;
    font-family: var(--font); font-size: 12px; font-weight: 700;
    border: none; cursor: pointer;
    transition: all 0.15s;
  }
  .rsvp-going { background: rgba(62,151,139,0.12); color: var(--teal); }
  .rsvp-maybe { background: var(--surface-high); color: var(--on-surface-variant); }
  .rsvp-join { background: var(--primary); color: #fff; }

  /* Attendees preview */
  .event-attendees {
    display: flex; align-items: center; gap: 6px; margin-top: 6px;
  }
  .attendee-avatars { display: flex; }
  .att-avatar {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #fff; object-fit: cover;
    margin-left: -6px;
  }
  .att-avatar:first-child { margin-left: 0; }
  .att-count { font-size: 11px; color: var(--on-surface-variant); }

  .fab { position: fixed; bottom: 92px; right: 20px; width: 56px; height: 56px; background: var(--primary); color: #fff; border: none; border-radius: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 24px rgba(5,12,37,0.3); cursor: pointer; z-index: 20; }

  .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; height: 72px; background: rgba(249,249,255,0.95); backdrop-filter: blur(12px); border-top: 1px solid rgba(198,198,206,0.4); display: flex; align-items: center; justify-content: space-around; padding: 0 8px; z-index: 50; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 12px; border: none; background: none; cursor: pointer; font-family: var(--font); color: var(--on-surface-variant); position: relative; }
  .nav-item.active { color: var(--primary); }
  .nav-item.active::before { content: ''; position: absolute; top: 0; left: 8px; right: 8px; height: 3px; background: var(--secondary); border-radius: 0 0 2px 2px; }
  .nav-item svg { width: 24px; height: 24px; }
  .nav-label { font-size: 10px; font-weight: 600; }
</style>
</head>
<body>

<div class="app-bar">
  <h1>Events</h1>
  <button class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg></button>
</div>

<div class="calendar-strip">
  <button class="cal-day"><span class="day-name">Mon</span><span class="day-num">25</span></button>
  <button class="cal-day has-event"><span class="day-name">Tue</span><span class="day-num">26</span></button>
  <button class="cal-day active has-event"><span class="day-name">Wed</span><span class="day-num">27</span></button>
  <button class="cal-day"><span class="day-name">Thu</span><span class="day-num">28</span></button>
  <button class="cal-day has-event"><span class="day-name">Fri</span><span class="day-num">29</span></button>
  <button class="cal-day"><span class="day-name">Sat</span><span class="day-num">30</span></button>
  <button class="cal-day"><span class="day-name">Sun</span><span class="day-num">31</span></button>
</div>

<div class="section-label">Today</div>

<div class="event-card">
  <div class="event-date-badge edb-today">
    <span class="month">Oct</span>
    <span class="day">27</span>
  </div>
  <div class="event-body">
    <div class="event-title">Sunday Family Dinner</div>
    <div class="event-detail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      7:00 PM - 10:00 PM
    </div>
    <div class="event-detail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Grandma's House
    </div>
    <span class="event-group-tag">Smith Family</span>
    <div class="event-attendees">
      <div class="attendee-avatars">
        <img class="att-avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=44&h=44&fit=crop&crop=faces" alt=""/>
        <img class="att-avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=44&h=44&fit=crop&crop=faces" alt=""/>
        <img class="att-avatar" src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=44&h=44&fit=crop&crop=faces" alt=""/>
      </div>
      <span class="att-count">+9 going</span>
    </div>
  </div>
  <div class="event-rsvp">
    <button class="rsvp-btn rsvp-going">Going</button>
  </div>
</div>

<div class="section-label">This Week</div>

<div class="event-card">
  <div class="event-date-badge edb-upcoming">
    <span class="month">Oct</span>
    <span class="day">29</span>
  </div>
  <div class="event-body">
    <div class="event-title">Reunion Hike</div>
    <div class="event-detail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      6:00 AM - 12:00 PM
    </div>
    <div class="event-detail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Western Ghats Trail
    </div>
    <span class="event-group-tag">College Crew</span>
    <div class="event-attendees">
      <div class="attendee-avatars">
        <img class="att-avatar" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=44&h=44&fit=crop&crop=faces" alt=""/>
        <img class="att-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=44&h=44&fit=crop&crop=faces" alt=""/>
      </div>
      <span class="att-count">5 going &middot; 2 maybe</span>
    </div>
  </div>
  <div class="event-rsvp">
    <button class="rsvp-btn rsvp-join">RSVP</button>
  </div>
</div>

<div class="event-card">
  <div class="event-date-badge edb-default">
    <span class="month">Nov</span>
    <span class="day">02</span>
  </div>
  <div class="event-body">
    <div class="event-title">Diwali Celebration</div>
    <div class="event-detail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Evening
    </div>
    <div class="event-detail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Home
    </div>
    <span class="event-group-tag">Smith Family</span>
  </div>
  <div class="event-rsvp">
    <button class="rsvp-btn rsvp-maybe">Maybe</button>
  </div>
</div>

<button class="fab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>

<nav class="bottom-nav">
  <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="nav-label">Home</span></button>
  <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="nav-label">Chats</span></button>
  <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="nav-label">Groups</span></button>
  <button class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="nav-label">Events</span></button>
  <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="nav-label">You</span></button>
</nav>

</body>
</html>
