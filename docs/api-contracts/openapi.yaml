openapi: 3.1.0
info:
  title: CIRCLE API
  version: 0.3.11
  license:
    name: Proprietary
  summary: Private nested groups, invites and Memories for any community.
  description: |
    **Status: approved by the owner for implementation (23 Oct 2026).** Every
    operation in this document is implemented in `backend/` (PHP 8.3, MySQL/MariaDB)
    and may be used by the app. 0.3.1 implements the M4 private media operations
    (ADR 0007) and adds the `media` list to Memory responses. 0.3.2 adds the
    reviewed `saved` and `q` filters to `GET /memories` without changing its response shape.

    ## Conventions
    - Base path `/api/v1`, JSON request and response bodies (`Content-Type: application/json`).
    - All timestamps are UTC, formatted `YYYY-MM-DD HH:MM:SS`.
    - Successful responses use `{ "success": true, "message": string, "data": ... }`;
      list endpoints with pagination use `{ "success": true, "data": [...], "pagination": {...} }`.
    - Errors always use the `Error` envelope with a stable machine-readable `code`.
      Raw database or exception text is never returned.

    ## Authorization model
    - Authenticated endpoints need `Authorization: Bearer <access_token>`.
      The token's session must still be open (not logged out) and the account `active`.
    - Group access is **active membership of the exact group id**. Membership of a
      parent or child group never grants access. "Group does not exist" and "you are
      not a member" return the same `403 not_member`, and a Memory in a group you are
      not in returns the same `404` as a missing Memory, so ids cannot be probed.
    - Roles: one `owner` (always also an admin; cannot be removed, demoted or leave —
      ownership can be transferred), `admin`, `member`.

    ## Rate limits (per client IP, fixed 60-second window)
    - `/auth/register`, `/auth/login`, `/auth/refresh`: `RATE_LIMIT_AUTH_PER_MINUTE` (default 10).
    - Authenticated profile/group photo reads use a separate per-IP bucket `RATE_LIMIT_PROFILE_PHOTOS_PER_MINUTE` (default 240/minute), still requiring profile ownership/shared exact membership or exact group membership. They do not exhaust general mutation/list quota.
    - Every other endpoint except profile/group photo reads and `/health`, including `/invites/{token}` preview and
      `/auth/logout`: `RATE_LIMIT_PER_MINUTE` (default 60).
    - Login and authenticated change-password share a per-mobile-number limit on failed credential attempts:
      `LOGIN_MAX_FAILURES_PER_MOBILE` (default 10) per 15 minutes, across all IPs.
    - Photo upload tickets also have a per-person limit: `MEDIA_UPLOADS_PER_HOUR`
      (default 60) per hour, and at most `MEDIA_MAX_OPEN_UPLOADS` (default 50)
      unattached uploads per person (`422 media_limit_reached`).
    - Exceeding a limit returns `429 rate_limited` with a `Retry-After` header (seconds).

    ## Media (ADR 0007)
    - The app only ever sees media **ids**. Bytes are reached through a signed link
      from `GET /media/{mediaId}`, valid for about 5 minutes and re-authorized on
      every request. Signed paths are relative to the API base (`/api/v1`).
    - Uploads are re-encoded on the server (all metadata, including EXIF/GPS, is
      removed) into `thumb` (≤ 320 px), `medium` (≤ 1080 px) and `full` (≤ 2048 px),
      stored as WebP (JPEG if the server's GD has no WebP). Originals are never kept.
    - Accepted types: JPEG, PNG, WebP. HEIC is accepted only when the server's image
      processor supports it; the current GD-based server does **not**, and answers
      `415 media_type_not_allowed` (the app should convert HEIC to JPEG first).
    - When the server cannot process images (no image library installed) upload
      requests fail closed with `503 server_error`; when the media signing secret is
      not configured, media requests return `500 server_error`.

    ## Notification capture (0.3.5, gated)
    With PUSH_QUEUE_ENABLED=true, committed Memory/comment/reply mutations capture
    current opted-in exact members' registered Android login sessions in a transactional outbox.
    The actor is excluded; comments notify the Memory owner and reply target only.
    No provider network call occurs inside these HTTP mutations. Rolled-back mutations
    produce no outbox entries. Capture/delivery default off; native client acceptance is pending.
    Worker Memory envelopes follow PushMemoryEnvelope; group invitations follow
    PushGroupInvitationEnvelope (0.3.7) with recipient-consent authorization. This
    does not introduce a public queue endpoint. Reports use PushGroupReportEnvelope
    (0.3.11), with groups opt-in, current exact-admin/session checks and a private
    queue fetch before foreground/headless display or tap. One alert per target/device;
    no reporter identity, reason, note or content is included.
    Retries are at-least-once: client event-id deduplication and account/server/session checks
    are mandatory before presentation. Generic API idempotency keys remain planned;
    report-duplicate and media-upload deduplication are defined per operation.

    ## Not yet implemented (planned, not part of this contract)
    Direct add with consent, events, polls, chat (and chat attachments), albums,
    idempotency keys (other than media upload tickets), account recovery/number
    change, OTP.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development (`composer serve`)
tags:
  - name: Notifications
    description: Session-bound devices and persistent opt-in delivery policy; dispatch remains disabled.
  - name: System
    description: Service health.
  - name: Auth
    description: Mobile number + password accounts and sessions (ADR 0005).
  - name: Profile
    description: The signed-in person.
  - name: Groups
    description: Nested groups (max depth 10) with identical rules at every level.
  - name: Members
    description: Roles, removal, bans.
  - name: Invites
    description: Expiring, revocable invite links.
  - name: Join requests
    description: Manual approval flow.
  - name: Memories
    description: The shared post stream of a group, with comments, reactions and saves.
  - name: Media
    description: |
      Private photos for Memories (ADR 0007, milestone M4; albums and chat later).
      Media is only ever reachable through short-lived signed links issued after
      an exact-group membership check.
security:
  - bearerAuth: []

paths:
  /me/sessions:
    get:
      operationId: listMyLoginSessions
      tags: [Auth]
      summary: List only the authenticated account's active login sessions.
      description: |
        One row per login, not per refresh or FCM token. Rotating credentials retains
        the public id. Expired/revoked sessions are excluded. Device/app/OS details
        are client-reported labels, not verified identities. Last activity/IP are
        captured server-side at most once per minute from the connection address;
        untrusted forwarding headers are ignored. Location is an optional client-shared
        city/region label with its own timestamp, not inferred from IP or tracked.
        No raw JWT sid, refresh hash, bearer/FCM token or coordinates are returned.
        Migrated sessions can show Unknown device until that client updates details.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
      responses:
        '200':
          description: Owner-only active sessions ordered by last activity, then public id.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, pagination]
                properties:
                  success: {const: true}
                  data: {type: array, items: {$ref: '#/components/schemas/LoginSession'}}
                  pagination:
                    type: object
                    properties:
                      total: {type: integer}
                      limit: {type: integer}
                      offset: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /me/sessions/{sessionId}:
    parameters:
      - {name: sessionId, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}$'}, description: Public session handle; never the JWT sid.}
    delete:
      operationId: revokeMyLoginSession
      tags: [Auth]
      summary: Log out a chosen session, including the current device.
      description: |
        Authenticated account must own the handle; nonexistent and non-owned handles
        both return 404. User-first locking serializes with login/refresh/password change
        and rechecks the caller's active session. Revokes all target refresh rows and
        device registrations, invalidating its access tokens and future queued push.
        An already revoked owned handle is idempotently successful. Other sessions,
        accounts and memberships remain unchanged. Already delivered data/in-flight
        requests cannot be recalled. Clients clear local state if the current session ends.
      responses:
        '200':
          description: Chosen session revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {const: true}
                  data:
                    type: object
                    required: [current_session_revoked]
                    properties:
                      current_session_revoked: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /me/session:
    patch:
      operationId: updateCurrentLoginSession
      tags: [Auth]
      summary: Update display metadata for the current session only.
      description: |
        Device details are optional labels; none participate in authentication.
        Location is shared explicitly by the user, stored only as a city/region label,
        and removable with null. Clients must not upload latitude/longitude, hardware
        identifiers, address books or background location. Other sessions cannot be edited.
        Values are trimmed UTF8 text, bounded in bytes and contain no control characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                device_label: {type: string, minLength: 1, maxLength: 120}
                os_version: {type: string, maxLength: 80}
                app_version: {type: string, maxLength: 40}
                location_label: {type: [string, 'null'], maxLength: 160}
      responses:
        '200': {description: Current session details updated; data is null.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /groups/{id}/contact-invitations:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      operationId: inviteGroupContact
      tags: [Groups]
      summary: Invite one explicitly confirmed contact without granting membership.
      description: |
        Requires active exact membership and admin role or member link-sharing permission.
        Only the selected E164 number is submitted; no address-book upload or public lookup.
        Unknown/inactive accounts return share_link without account details. Invited recipients
        must accept. Pending invitations last seven days; duplicate live invitations reuse the
        same id. Terminal invitations have a 24-hour cooldown; later invitations get new ids.
        Each sender has 20 attempts/hour including misses and forbidden attempts after validation.
        Bans, removed membership and parent membership are enforced server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mobile]
              properties:
                mobile: {type: string, pattern: '^\+[1-9][0-9]{7,14}$'}
      responses:
        '200':
          description: Outcome only; no recipient profile or phone is returned.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    type: object
                    required: [outcome]
                    properties:
                      outcome: {type: string, enum: [invited, already_pending, share_link, already_member, unavailable]}
                      invitation_id: {type: integer, description: Present only for invited or already_pending.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /me/group-invitations:
    get:
      operationId: listMyGroupInvitations
      tags: [Groups]
      summary: Recipient-owned invitation history, newest updates first.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
      responses:
        '200':
          description: Pending and terminal invitations, paginated by offset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {const: true}
                  data: {type: array, items: {$ref: '#/components/schemas/GroupInvitation'}}
                  pagination:
                    type: object
                    required: [total, limit, offset]
                    properties:
                      total: {type: integer}
                      limit: {type: integer}
                      offset: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /group-invitations/{invitationId}:
    parameters:
      - {name: invitationId, in: path, required: true, schema: {type: integer}}
    get:
      operationId: getMyGroupInvitation
      tags: [Groups]
      summary: Preview an invitation owned by the authenticated recipient.
      responses:
        '200':
          description: Authorized minimal preview.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupInvitationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /group-invitations/{invitationId}/accept:
    parameters:
      - {name: invitationId, in: path, required: true, schema: {type: integer}}
    post:
      operationId: acceptMyGroupInvitation
      tags: [Groups]
      summary: Accept an invitation with explicit recipient consent.
      description: |
        Requires recipient ownership; missing and non-owned ids both return 404.
        Acceptance rechecks current inviter permission, parent membership and bans.
        Admin invitations join after consent; member invitations obey manual approval.
        Repeated acceptance never restores subsequently removed membership.
        Expired acceptance returns 410 invitation_expired; unavailable returns 403 invitation_unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, maxProperties: 0}
      responses:
        '200':
          description: Updated invitation and status (joined, pending_approval, accepted, declined or expired).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupInvitationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {description: Invitation expired.}
        '422': {$ref: '#/components/responses/ValidationError'}
  /group-invitations/{invitationId}/decline:
    parameters:
      - {name: invitationId, in: path, required: true, schema: {type: integer}}
    post:
      operationId: declineMyGroupInvitation
      tags: [Groups]
      summary: Decline an invitation with explicit recipient consent.
      description: |
        Requires recipient ownership; missing and non-owned ids both return 404.
        Acceptance rechecks current inviter permission, parent membership and bans.
        Admin invitations join after consent; member invitations obey manual approval.
        Repeated acceptance never restores subsequently removed membership.
        Expired acceptance returns 410 invitation_expired; unavailable returns 403 invitation_unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, maxProperties: 0}
      responses:
        '200':
          description: Updated invitation and status (joined, pending_approval, accepted, declined or expired).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupInvitationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {description: Invitation expired.}
        '422': {$ref: '#/components/responses/ValidationError'}
  /devices/register:
    post:
      operationId: registerPushDevice
      tags: [Notifications]
      summary: Bind an opaque FCM token to the authenticated login session.
      description: |
        Idempotent registration; a token is reassigned to the current account/session.
        Tokens are case-sensitive, never trimmed or returned. Platforms are android or ios.
        A revoked/expired session cannot register, even if revocation raced middleware.
        Existing unscoped registrations are ineligible until authenticated re-registration.
        Server logout removes registrations for that login session independently of SDK cleanup.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushDeviceRegistration' }
      responses:
        '200':
          description: Bound to this session.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [registered]
                        properties:
                          registered: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /devices/unregister:
    post:
      operationId: unregisterPushDevice
      tags: [Notifications]
      summary: Idempotently remove only this session's matching device token.
      description: An older login or another account cannot unregister a token reassigned to a newer session. The response does not disclose token ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushDeviceToken' }
      responses:
        '200':
          description: Removed if owned by this account and login session.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [unregistered]
                        properties:
                          unregistered: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [Notifications]
      summary: Read owner-only persistent delivery policy, with opt-in defaults.
      responses:
        '200': { $ref: '#/components/responses/NotificationPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      operationId: updateNotificationPreferences
      tags: [Notifications]
      summary: Atomically merge selected preference fields and category switches.
      description: |
        Unknown fields/categories, nulls, coercible strings and non-boolean switches are rejected.
        Category updates are partial; omitted switches and fields retain their stored values.
        Quiet times are local minutes in the IANA timezone. Start and end must differ.
        Start is inclusive and end exclusive, across midnight and daylight-saving changes.
        Defaults disable push globally and all categories, with quiet hours 22:00–07:00 UTC.
        This foundation does not schedule or dispatch events or expose live settings UI.
        The delivery worker must defer quiet-hour events; filtering alone does not schedule them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferencePatch' }
      responses:
        '200': { $ref: '#/components/responses/NotificationPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, const: healthy }
                          time: { type: string, format: date-time }
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Register with mobile number and password
      description: |
        Creates an account if the number is not registered. **The response is identical
        whether or not the number was already registered** (ADR 0005: never reveal whether
        a number is registered). The client then calls `/auth/login`; no tokens are issued here.
        Passwords are used exactly as sent (never trimmed), 15–128 Unicode characters,
        hashed with Argon2id (m=64 MiB, t=3, p=1).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, password]
              properties:
                mobile: { $ref: '#/components/schemas/Mobile' }
                password: { $ref: '#/components/schemas/Password' }
                display_name: { type: string, maxLength: 100 }
      responses:
        '202':
          description: Accepted. Same body for new and already-registered numbers.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          next: { type: string, const: login }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      parameters:
        - {name: X-Circle-Device, in: header, schema: {type: string, maxLength: 120}, description: Optional client-reported device label; malformed values are ignored.}
        - {name: X-Circle-OS, in: header, schema: {type: string, maxLength: 80}}
        - {name: X-Circle-App, in: header, schema: {type: string, maxLength: 40}}
      operationId: login
      tags: [Auth]
      summary: Sign in and open a session
      description: |
        Failures are generic (`401 invalid_credentials`) for unknown numbers, wrong
        passwords and deleted accounts, and always cost one Argon2id verification.
        `403 account_inactive` is only returned when the correct password was given.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, password]
              properties:
                mobile: { type: string }
                password: { type: string, description: Sent exactly as typed; never trimmed. }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/TokenPair'
                          - type: object
                            properties:
                              user:
                                type: object
                                properties:
                                  id: { type: integer }
                                  mobile: { type: string }
                                  display_name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      operationId: refreshTokens
      tags: [Auth]
      summary: Rotate the refresh token
      description: |
        Each refresh token can be redeemed exactly once; the response contains a new
        pair for the same session. Access tokens issued earlier in the session remain
        valid until they expire.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [Auth]
      summary: Change my password and end all my sessions
      description: |
        Requires an active authenticated session and the current password; not recovery or OTP reset.
        Strings are used byte-for-byte, never trimmed. New password uses the Password schema (15–128 Unicode characters)
        and must differ from current_password. Current input is limited to 1024 UTF-8 bytes.
        Success atomically updates the hash, revokes ALL access/refresh sessions including this one and removes all
        device registrations for this account. It issues no replacement tokens. Sign in again on every device.
        Other accounts, group memberships and content are unchanged. Already-dispatched requests/provider messages cannot be recalled.
        Wrong-current attempts use the shared per-mobile login failure budget (default 10/15min across IPs),
        in addition to the normal per-IP rate limit. Retry-After is supplied on 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              additionalProperties: false
              properties:
                current_password: { type: string, minLength: 1, description: Exact current password; maximum 1024 UTF-8 bytes. }
                new_password: { $ref: '#/components/schemas/Password' }
      responses:
        '200':
          description: Password changed; all sessions revoked. No replacement credentials.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [sign_in_required]
                        properties:
                          sign_in_required: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Invalid input or invalid_current_password. Credentials are never echoed; account state is unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: End the current session
      description: Revokes the session of the presented access token; its access and refresh tokens stop working immediately.
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me:
    get:
      operationId: getMe
      tags: [Profile]
      summary: My profile
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      operationId: updateMe
      tags: [Profile]
      summary: Update my profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                display_name: { type: string, minLength: 1, maxLength: 100 }
                about: { type: string, maxLength: 500 }
                current_city: { type: string, maxLength: 100 }
                hometown: { type: string, maxLength: 100 }
                work: { type: string, maxLength: 100 }
                education: { type: string, maxLength: 150 }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/photos/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [avatar, cover] }
    get:
      operationId: getMyProfilePhoto
      tags: [Profile]
      summary: Read my profile or cover photo
      description: |
        Bearer-authenticated bytes, never a public or signed storage URL. Owner access
        is allowed. Other viewers must currently share at least one exact group with
        the active photo owner, with both memberships active. Ancestor membership
        alone does not qualify. Missing, inactive and inaccessible owners/photos all
        return 404. Authorization is checked on every read; Cache-Control is private,
        no-store. The optional personal detail fields remain owner-only.
      parameters:
        - name: size
          in: query
          schema: { type: string, enum: [thumb, medium, full], default: medium }
      responses:
        '200':
          description: Re-encoded image bytes, metadata stripped; no-store and nosniff.
          content:
            image/webp:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      operationId: replaceMyProfilePhoto
      tags: [Profile]
      summary: Replace my profile or cover photo
      description: |
        Owner-only. These account photos are visible to authenticated members of
        any exact group shared with the owner, not publicly. They are separate from
        exact-group Memory assets. No storage paths or URLs leave the server.
        Input maximum 5 MiB (5242880 bytes), 2048 pixels per side and 4194304 pixels.
        The real type must match Content-Type. JPEG, PNG and WebP are decoded and
        re-encoded (metadata removed) into thumb 320, medium 1080 and full 2048
        maximum long-edge variants without upscaling. HEIC/SVG/GIF are not accepted.
        A failed replacement leaves the previous photo unchanged.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Full updated owner profile; the corresponding version changes or becomes null.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: Upload exceeds 5 MiB (media_too_large).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Unsupported real image type (media_type_not_allowed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/MediaRejected' }
        '503':
          description: Image processor unavailable (server_error).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteMyProfilePhoto
      tags: [Profile]
      summary: Remove my profile or cover photo
      description: |
        Owner-only. These account photos are visible to authenticated members of
        any exact group shared with the owner, not publicly. They are separate from
        exact-group Memory assets. No storage paths or URLs leave the server.
        Idempotent: removing an already absent photo also succeeds. Old references
        become inaccessible immediately; storage cleanup is best-effort after commit.
      responses:
        '200':
          description: Full updated owner profile; the corresponding version changes or becomes null.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /profiles/{userId}/photos/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [avatar, cover] }
      - name: userId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getSharedProfilePhoto
      tags: [Profile]
      summary: Read a profile photo shared with my groups
      description: |
        Bearer-authenticated bytes, never a public or signed storage URL. Owner access
        is allowed. Other viewers must currently share at least one exact group with
        the active photo owner, with both memberships active. Ancestor membership
        alone does not qualify. Missing, inactive and inaccessible owners/photos all
        return 404. Authorization is checked on every read; Cache-Control is private,
        no-store. The optional personal detail fields remain owner-only.
      parameters:
        - name: size
          in: query
          schema: { type: string, enum: [thumb, medium, full], default: medium }
      responses:
        '200':
          description: Re-encoded image bytes, metadata stripped; no-store and nosniff.
          content:
            image/webp:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /groups/{id}/reports:
    parameters:
      - {$ref: '#/components/parameters/GroupId'}
    post:
      operationId: reportGroupContent
      tags: [Groups]
      summary: Report an accessible Memory, comment or member to exact group admins.
      description: |
        Current exact membership and active target required; no self reports.
        Parent membership never grants access. One report per account/target;
        duplicate retries succeed without changing the report, version or alerts.
        At most10 new reports per account/hour across groups; duplicates do not consume this budget.
        Admin responses omit reporter accounts, notes, mobiles and report row ids.
        Optional notes are private write-side text, never included in admin APIs/push.
        New reports capture one generic group.report admin alert per target/device,
        under groups preferences, quiet hours and current session/admin checks.
        Chats/events/subgroups, blocking, deletion/export and platform escalation
        are separate capabilities, not enabled by this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, target_id, reason]
              properties:
                kind: {type: string, enum: [memory, comment, member]}
                target_id: {type: integer, minimum: 1}
                reason: {type: string, enum: [spam, harassment, hate, nudity, violence, privateInfo, other]}
                note: {type: string, maxLength: 500}
      responses:
        '200': {description: Report recorded, or duplicate safely ignored. No target/report identity returned.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
    get:
      operationId: listPrivateGroupReports
      tags: [Groups]
      summary: Private paginated review queue and latest 50 admin actions.
      description: |
        Active exact admins only. Private,no-store. Open targets and hidden content
        remain reviewable; dismissed visible targets leave the queue. Hidden content
        is inspected here only, never through ordinary Memory/media endpoints.
        Removed content has null summary and available=false; cannot be restored.
        Offset pagination ordered updated_at/id descending is not a frozen snapshot;
        refresh after changes. Recent audit omits reporter identity/notes.
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 30, minimum: 1, maximum: 50}}
        - {name: offset, in: query, schema: {type: integer, default: 0, minimum: 0, maximum: 1000000}}
      responses:
        '200':
          description: Authorized queue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {const: true}
                  data:
                    type: object
                    required: [group_id, items, has_more, offset, limit, audit]
                    properties:
                      group_id: {type: integer}
                      has_more: {type: boolean}
                      offset: {type: integer}
                      limit: {type: integer}
                      items:
                        type: array
                        items:
                          type: object
                          required: [id, kind, target_id, version, updated_at, summary, hidden, available, reasons]
                          properties:
                            id: {type: integer, description: Moderation target handle; not a reporter/report row id.}
                            kind: {type: string, enum: [memory, comment, member]}
                            target_id: {type: integer}
                            version: {type: integer, minimum: 1}
                            updated_at: {type: string}
                            summary: {type: [string, 'null'], maxLength: 500}
                            hidden: {type: boolean}
                            available: {type: boolean}
                            reasons:
                              type: array
                              items:
                                type: object
                                properties:
                                  reason: {type: string}
                                  count: {type: integer}
                      audit:
                        type: array
                        maxItems: 50
                        items:
                          type: object
                          properties:
                            id: {type: integer}
                            action: {type: string, enum: [hide, unhide, dismiss, restore]}
                            created_at: {type: string}
                            kind: {type: string}
                            target_id: {type: integer}
                            actor_name: {type: string, description: Admin actor display name; not reporter.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /groups/{id}/reports/{reportTargetId}/actions:
    parameters:
      - {$ref: '#/components/parameters/GroupId'}
      - {name: reportTargetId, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      operationId: actOnPrivateGroupReport
      tags: [Groups]
      summary: Version-checked hide/restore/dismiss/reopen with admin audit.
      description: |
        Recheck active user/session/exact-admin under group/user/session/member locks.
        New reports/actions increment version; stale actions/retries return409.
        hide/unhide only Memory/comment targets; deleted content cannot be restored.
        Hiding Memory blocks all ordinary lists/Saved/search/detail/mutations and
        existing signed photo links, for admins too. Restoring retains deleted-asset
        state. Hiding a comment suppresses its descendant branch and counts; restoring
        a parent never unhides a separately hidden descendant. Admin queue is the only
        private inspection surface. Dismiss/reopen affects reports, not visibility.
        No reporter identities, notes or content in audit/push. Existing member-role,
        owner-protection and removal rules still apply through Members controls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, version]
              properties:
                action: {type: string, enum: [hide, unhide, dismiss, restore]}
                version: {type: integer, minimum: 1}
      responses:
        '200': {description: Saved and audited; version incremented exactly once.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Stale queue or removed target; refresh required.}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /groups/{id}/photos/{kind}:
    parameters:
      - {$ref: '#/components/parameters/GroupId'}
      - {name: kind, in: path, required: true, schema: {type: string, enum: [avatar, cover]}}
    get:
      operationId: getPrivateGroupPhoto
      tags: [Groups, Profile]
      summary: Read a private group picture or banner as an active exact member.
      description: |
        Both listed and hidden group images require active membership of this exact
        group; parent/ancestor membership and invitation preview never grant photo access.
        Missing/inaccessible photos return404. Private,no-store/nosniff responses; no
        public storage path or signed URL. Separate authenticated photo-read quota240/min.
      parameters:
        - {name: size, in: query, schema: {type: string, enum: [thumb, medium, full], default: medium}}
      responses:
        '200':
          description: Re-encoded, metadata-stripped image bytes.
          content:
            image/webp: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      operationId: replaceGroupPhoto
      tags: [Groups, Profile]
      summary: Add or replace the group picture/banner as a current owner/admin.
      description: |
        Active exact admin permission is checked before processing and again under
        group/user/session/membership locks before commit. Owner is an admin. Upload is
        raw JPEG/PNG/WebP, at most5MiB, at most2048px/side and4,194,304pixels. Re-encode
        through configured processor to thumb320/medium1080/full2048 variants, stripping
        metadata/originals. Fresh opaque UUID version per replacement. Failure, lost
        permission or ended session preserves old metadata/files and purges staging.
        No automatic photo-change push is emitted for this routine private edit.
      requestBody:
        required: true
        content:
          image/jpeg: {schema: {type: string, format: binary}}
          image/png: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '200':
          description: Updated exact group with avatar_version/cover_version and null cover_path.
          content:
            application/json:
              schema: {type: object, properties: {success: {const: true}, data: {$ref: '#/components/schemas/Group'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {description: media_too_large, over5MiB.}
        '415': {description: media_type_not_allowed.}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {description: Image processor unavailable; previous photo retained.}
    delete:
      operationId: removeGroupPhoto
      tags: [Groups, Profile]
      summary: Remove a picture/banner as a current owner/admin, independently.
      description: Same current authorization/session locks as replacement; repeated deletion is idempotent. Old variants purged after commit.
      responses:
        '200':
          description: Updated exact group; chosen photo version null, other photo unchanged.
          content:
            application/json:
              schema: {type: object, properties: {success: {const: true}, data: {$ref: '#/components/schemas/Group'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /groups:
    get:
      operationId: listMyGroups
      tags: [Groups]
      summary: Groups I am an active member of (all levels)
      responses:
        '200':
          description: My groups, ordered by root, depth, name.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/GroupSummary'
                            - type: object
                              properties:
                                role: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createGroup
      tags: [Groups]
      summary: Create a root group or a subgroup
      description: |
        Any user may create a root group. Any **active member of the parent** may create
        a subgroup. The creator becomes owner and admin. Maximum depth is 10 (root = 1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                type: { $ref: '#/components/schemas/GroupType' }
                description: { type: string, maxLength: 1000 }
                parent_id: { type: [integer, 'null'] }
                visibility: { $ref: '#/components/schemas/Visibility' }
                approval_mode: { $ref: '#/components/schemas/ApprovalMode' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /groups/{id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      operationId: getGroup
      tags: [Groups]
      summary: Group details (members only)
      responses:
        '200':
          description: Group.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Group'
                          - type: object
                            properties:
                              member_count: { type: integer }
                              my_role: { $ref: '#/components/schemas/Role' }
                              ancestors:
                                type: array
                                description: Breadcrumb from root to direct parent.
                                items:
                                  type: object
                                  properties:
                                    id: { type: integer }
                                    name: { type: string }
                                    depth: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      operationId: updateGroup
      tags: [Groups]
      summary: Update group settings (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 1000 }
                type: { $ref: '#/components/schemas/GroupType' }
                approval_mode: { $ref: '#/components/schemas/ApprovalMode' }
                visibility: { $ref: '#/components/schemas/Visibility' }
                link_sharing: { type: string, enum: [admins, members] }
      responses:
        '200':
          description: Updated group.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Group' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /groups/{id}/subgroups:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      operationId: listSubgroups
      tags: [Groups]
      summary: Direct subgroups visible to me
      description: Listed subgroups, plus hidden subgroups I am an active member of. Requires membership of `{id}`.
      responses:
        '200':
          description: Subgroups.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/GroupSummary'
                            - type: object
                              properties:
                                my_role: { oneOf: [{ $ref: '#/components/schemas/Role' }, { type: 'null' }] }
                                member_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /groups/{id}/leave:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      operationId: leaveGroup
      tags: [Groups]
      summary: Leave a group and all its subgroups
      description: |
        Cascades to every descendant group, cancels my pending join requests there and
        revokes invite links I created there. Refused for the owner (`owner_protected`),
        for the last admin (`last_admin`), and while I own or am the only admin of any
        descendant group I belong to (`409 subgroup_handover_required`, with
        `error.details.groups` listing those groups and the reason).
      responses:
        '200':
          description: Left.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          left_groups:
                            type: array
                            items:
                              type: object
                              properties:
                                group_id: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/HandoverRequired' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /groups/{id}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      operationId: transferOwnership
      tags: [Groups]
      summary: Transfer ownership (owner only)
      description: The new owner must be an active member and becomes admin; the previous owner stays admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_owner_id]
              properties:
                new_owner_id: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /groups/{id}/members:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      operationId: listMembers
      tags: [Members]
      summary: Active members (members only)
      description: Mobile numbers are never included.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
          description: Out-of-range values are clamped.
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Members, admins first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
                  pagination: { $ref: '#/components/schemas/OffsetPagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /groups/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateMemberRole
      tags: [Members]
      summary: Change a member's role (admins)
      description: The owner's role cannot be changed; the last admin cannot be demoted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: removeMember
      tags: [Members]
      summary: Remove or ban a member (admins)
      description: |
        Removes the member from this group and every descendant (cascade), cancels their
        pending join requests and revokes links they created in that subtree. A removed
        person can only rejoin through an invite link **created after** the removal.
        With `ban=true` they cannot rejoin this group at all until unbanned.
        Refused while the member owns or is the only admin of a descendant group
        (`409 subgroup_handover_required`, without naming the subgroups).
      parameters:
        - name: ban
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/HandoverRequired' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /groups/{id}/members/{userId}/unban:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: unbanMember
      tags: [Members]
      summary: Lift a ban (admins)
      description: The person is then treated as removed (needs a link created after the original removal).
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{id}/invite-links:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      operationId: listInviteLinks
      tags: [Invites]
      summary: List the group's invite links (admins)
      description: Raw tokens are stored only as hashes and are never returned again.
      responses:
        '200':
          description: Up to 200 most recent links.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/InviteLinkInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createInviteLink
      tags: [Invites]
      summary: Create an invite link
      description: Admins only, or any member when the group's `link_sharing` is `members`. Links always expire.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_hours: { type: integer, minimum: 1, maximum: 720, default: 168 }
                max_uses: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
      responses:
        '201':
          description: Created. `token` is shown only once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NewInviteLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /groups/{id}/invite-links/reset:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      operationId: resetInviteLinks
      tags: [Invites]
      summary: Revoke all links and create a fresh one (admins)
      responses:
        '201':
          description: All previous links revoked; new default link (7 days, unlimited uses).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NewInviteLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /groups/{id}/invite-links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - name: linkId
        in: path
        required: true
        schema: { type: integer }
    delete:
      operationId: revokeInviteLink
      tags: [Invites]
      summary: Revoke one link
      description: Admins can revoke any link of the group; members can revoke links they created. Idempotent.
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: integer }
                          revoked: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invites/{token}:
    parameters:
      - $ref: '#/components/parameters/InviteToken'
    get:
      operationId: previewInvite
      tags: [Invites]
      summary: Preview an invite (public)
      security: []
      responses:
        '200':
          description: Group preview.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          group_name: { type: string }
                          group_type: { $ref: '#/components/schemas/GroupType' }
                          cover_path: { type: [string, 'null'] }
                          is_subgroup: { type: boolean }
                          approval_required: { type: boolean }
                          member_count: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/LinkGone' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /invites/{token}/join:
    parameters:
      - $ref: '#/components/parameters/InviteToken'
    post:
      operationId: joinViaInvite
      tags: [Invites]
      summary: Join (or request to join) via an invite link
      description: |
        - Subgroup links require active membership of the **direct parent** (`403 not_parent_member`).
        - `approval_mode=auto` joins immediately; `manual` creates one pending request
          (repeating the call while pending is a no-op).
        - A use is consumed atomically when a member joins or a new request is created.
        - Banned people, and removed people using a link created before their removal,
          get `403 join_not_allowed`.
      responses:
        '200':
          description: Joined or pending.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, enum: [joined, pending_approval] }
                          group_id: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/LinkGone' }

  /groups/{id}/join-requests:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      operationId: listJoinRequests
      tags: [Join requests]
      summary: Pending join requests (admins)
      description: Requesters are shown by display name only; mobile numbers are never exposed.
      responses:
        '200':
          description: Pending requests, oldest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/JoinRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /groups/{id}/join-requests/{rid}/approve:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: approveJoinRequest
      tags: [Join requests]
      summary: Approve a request (admins)
      description: |
        Re-checks that the requester is still an active member of the direct parent and
        is not banned. If not, the request is cancelled and `409 not_parent_member` or
        `409 join_not_allowed` is returned.
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /groups/{id}/join-requests/{rid}/decline:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/RequestId'
    post:
      operationId: declineJoinRequest
      tags: [Join requests]
      summary: Decline a request (admins)
      description: The person may request again later.
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /memories:
    get:
      operationId: listMemories
      tags: [Memories]
      summary: Memories from my groups, newest first
      description: |
        Without `group_id`: Memories from every group I am an active member of.
        With `group_id`: that exact group only (`403 not_member` otherwise).
        `saved=true` restricts the list to Memories saved by the current viewer.
        `saved=false` (the default) does not restrict by saved state.
        `q` is a literal substring search over body and place, using the database's
        configured Unicode collation. SQL LIKE wildcard characters (`%`, `_`, `!`)
        in the input are treated literally. It is trimmed, must be valid UTF-8,
        and has at most 200 Unicode code points; empty/whitespace-only is unfiltered.
        Filters combine with AND and never expand membership or visibility.
        Keyset pagination: pass `pagination.next_cursor` back as `cursor`; it is opaque.
      parameters:
        - name: group_id
          in: query
          schema: { type: integer }
        - name: saved
          in: query
          schema: { type: boolean, default: false }
          description: Only the strings true and false are accepted; other values return 422.
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
          description: Trimmed literal substring over Memory body and place; empty is unfiltered.
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
          description: Out-of-range values are clamped.
      responses:
        '200':
          description: A page of Memories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MemoryListItem' }
                  pagination: { $ref: '#/components/schemas/CursorPagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /groups/{id}/memories:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      operationId: createMemory
      tags: [Memories]
      summary: Share a Memory in a group (members)
      description: |
        The group is taken from the path only; any `group_id` in the body is ignored.
        `body` is required (1–2000 characters) unless `media_ids` is non-empty; then it
        may be empty or omitted (stored and returned as `""`). Photos are attached in
        the same transaction as the Memory; if any id is not usable the whole request
        fails with `422 validation_error` and `error.details.media_ids` lists the
        refused ids (the same answer for unknown, foreign, unready, discarded or
        already attached media).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 2000, description: 'Required (min 1 character) when `media_ids` is empty or absent.' }
                memory_date: { type: string, format: date }
                place: { type: string, maxLength: 255 }
                media_ids:
                  type: array
                  maxItems: 10
                  uniqueItems: true
                  items: { type: string, format: uuid }
                  description: |
                    Photos in display order. Each must be `ready`, uploaded by the
                    caller to this same group, not discarded and not attached to
                    anything yet. An asset can be attached only once.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Memory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /memories/{id}:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    get:
      operationId: getMemory
      tags: [Memories]
      summary: A Memory with comments and reactions (members of its group)
      responses:
        '200':
          description: Memory.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Memory'
                          - type: object
                            properties:
                              comments:
                                type: array
                                items: { $ref: '#/components/schemas/Comment' }
                              reactions:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    user_id: { type: integer }
                                    emoji: { $ref: '#/components/schemas/Emoji' }
                                    display_name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateMemory
      tags: [Memories]
      summary: Edit my Memory (author, still a member)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
                memory_date: { type: string, description: 'YYYY-MM-DD, or empty string to clear.' }
                place: { type: string, maxLength: 255, description: Empty string clears. }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Memory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteMemory
      tags: [Memories]
      summary: Remove a Memory (author or admin of that exact group)
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /memories/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    post:
      operationId: addComment
      tags: [Memories]
      summary: Comment on a Memory (members)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
                parent_id: { type: [integer, 'null'], description: Must be an active comment on the same Memory. }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Comment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /memories/{id}/reactions:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    post:
      operationId: toggleReaction
      tags: [Memories]
      summary: Toggle my reaction (members)
      description: Same emoji again removes my reaction; a different emoji replaces it. One reaction per person.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                emoji: { $ref: '#/components/schemas/Emoji' }
      responses:
        '200':
          description: New state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reacted: { type: boolean }
                          emoji: { oneOf: [{ $ref: '#/components/schemas/Emoji' }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /memories/{id}/save:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    post:
      operationId: toggleSave
      tags: [Memories]
      summary: Toggle saved (members)
      responses:
        '200':
          description: New state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          saved: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups/{id}/media/uploads:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      operationId: createMediaUpload
      tags: [Media]
      summary: Ask for an upload ticket (members)
      description: |
        Checks active membership of the exact group (`403 not_member` otherwise), the
        type allowlist (`415`), the size limit (`413`), the cap on unattached uploads
        (`422 media_limit_reached`) and the per-person hourly limit (`429`), then
        returns a ticket valid for 15 minutes. Repeating the same `client_upload_id`
        with the same group, type, size and hash returns the same ticket (idempotent,
        not counted against the limits); reusing it for a different upload returns
        `409 conflict`. `image/heic` is refused with `415` unless the server's image
        processor supports HEIC (the current GD-based server does not).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_upload_id, mime_type, byte_size, sha256]
              properties:
                client_upload_id: { type: string, format: uuid }
                mime_type:
                  type: string
                  enum: [image/jpeg, image/png, image/webp, image/heic]
                  description: '`image/heic` only when the server supports it (see above).'
                byte_size: { type: integer, minimum: 1, maximum: 15728640, description: 'Exact size of the bytes that will be sent; at most 15 MiB.' }
                sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$', description: SHA-256 of exactly those bytes (hex). }
      responses:
        '201':
          description: Upload ticket created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MediaUploadTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/MediaRejected' }
        '415': { $ref: '#/components/responses/MediaRejected' }
        '422':
          description: '`validation_error`, or `media_limit_reached` (too many unattached uploads).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/MediaUnavailable' }

  /media/uploads/{uploadId}/content:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    put:
      operationId: uploadMediaContent
      tags: [Media]
      summary: Send the photo bytes (ticket owner)
      description: |
        Raw bytes as the request body. Only the ticket's owner, while still an active
        member of the group (otherwise the same `404` as an unknown upload), before the
        ticket expires (`410 upload_expired`). The body must be exactly the announced
        size and SHA-256 (`422 media_invalid`); a body larger than announced is cut off
        with `413 media_too_large`. The server checks the real content, not the name or
        `Content-Type`: magic bytes and file signature must be an allowed type (`415
        media_type_not_allowed`), must match the announced type and have a readable
        header with sane dimensions (at most 12000 px per side and 40 MP; `422
        media_invalid`). It then re-encodes the photo (removing all metadata including
        GPS/EXIF), creates `thumb`, `medium` and `full` sizes, discards the original
        and marks the asset `ready`. Sending again after success returns the ready
        asset. If the content cannot be decoded the upload becomes `failed` (`422
        media_invalid`; start a new upload). Unattached assets are deleted after 24 hours.
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          image/heic: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: Processed and ready to attach.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MediaAsset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/MediaRejected' }
        '413': { $ref: '#/components/responses/MediaRejected' }
        '415': { $ref: '#/components/responses/MediaRejected' }
        '422': { $ref: '#/components/responses/MediaRejected' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/MediaUnavailable' }

  /media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    get:
      operationId: getMediaLink
      tags: [Media]
      summary: Get a short-lived signed link to view a photo (members)
      description: |
        Re-checked on **every** request: the asset is `ready`; the caller is an active
        member of the asset's exact group (never inherited from parent or child
        groups); an asset not yet attached to a Memory is visible to its uploader only;
        and moderation hasn't hidden it (hidden media is `404` for everyone, including
        admins; restore visibility from the private moderation queue to re-enable ready assets). Chat attachments (conversation access,
        ADR 0003) come with chat. A missing asset and one you can't see both return the
        same `404`. The returned `url` is relative to the API base and needs no bearer
        token.
      parameters:
        - name: size
          in: query
          required: false
          schema: { type: string, enum: [thumb, medium, full], default: medium }
      responses:
        '200':
          description: Signed link valid for `MEDIA_LINK_TTL` seconds (default 300).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SignedMediaLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      operationId: deleteUnattachedMedia
      tags: [Media]
      summary: Discard an upload that was never attached (uploader)
      description: |
        Only the uploader (otherwise the same `404` as an unknown id), and only while
        the asset is not attached to a Memory (`409 conflict`). Its files are removed
        at once. Attached media is deleted by deleting the Memory: it stops being
        served immediately and its files are purged after `MEDIA_PURGE_AFTER_DAYS`
        (default 7).
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /media/files/{mediaId}/{size}:
    get:
      operationId: getMediaFile
      tags: [Media]
      summary: Download photo bytes with a signed link (no bearer token)
      description: |
        No bearer token: access comes only from the signature returned by
        `GET /media/{mediaId}` (hex HMAC-SHA256 over `id|size|expires`, with a secret
        separate from `JWT_SECRET`). Expired, tampered or mismatched (other id or size)
        links return `403 media_link_invalid`. A media item deleted or hidden after the
        link was issued returns `404`. Rate-limited per IP like other endpoints.
        Response headers: `Cache-Control: private, max-age=<seconds until expiry>`,
        `X-Content-Type-Options: nosniff`, `Content-Disposition: inline`,
        `Content-Security-Policy: default-src 'none'; sandbox`. The server may hand the
        transfer to the web server (`X-Sendfile`/`X-Accel-Redirect`); clients see the
        same response.
      security: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
        - name: size
          in: path
          required: true
          schema: { type: string, enum: [thumb, medium, full] }
        - name: expires
          in: query
          required: true
          schema: { type: integer, description: Unix time. }
        - name: sig
          in: query
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: The image.
          headers:
            Cache-Control:
              schema: { type: string, examples: ['private, max-age=300'] }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            image/webp: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/MediaRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 access token (default lifetime 3600 s). Claims: `sub`, `sid` (session),
        `jti`, `iat`, `exp` (mandatory), `type=access`. Refresh tokens (`type=refresh`,
        default 604800 s) are only accepted by `/auth/refresh`.

  parameters:
    GroupId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer }
    RequestId:
      name: rid
      in: path
      required: true
      schema: { type: integer }
    MemoryId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteToken:
      name: token
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }

  responses:
    NotificationPreferences:
      description: Owner policy. Push delivery and native support are separate capabilities.
      headers:
        Cache-Control:
          schema: { type: string, const: 'private, no-store' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/NotificationPreferences' }
    OkNull:
      description: Done.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data: { type: 'null' }
    ValidationError:
      description: '`validation_error`, `invalid_cursor`, `owner_protected`, `last_admin`, `depth_limit`, `member_not_found` (transfer target).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: '`unauthorized` (no token), `invalid_token`, `invalid_credentials`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '`account_inactive`, `not_member`, `forbidden` (role too low), `not_parent_member`, `join_not_allowed`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`not_found`, `member_not_found`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: '`already_member`, `not_parent_member`, `join_not_allowed`, `conflict`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    HandoverRequired:
      description: '`subgroup_handover_required`. On leave, `error.details.groups` lists `{id, name, reason: owner|last_admin}`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LinkGone:
      description: '`link_revoked`, `link_expired`, `link_exhausted`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MediaRejected:
      description: |
        The upload or link was refused: `media_too_large` (413),
        `media_type_not_allowed` (415), `media_invalid` (422), `upload_expired` (410)
        or `media_link_invalid` (403).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: '`rate_limited`. See `Retry-After`.'
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MediaUnavailable:
      description: '`server_error` (503) — the server cannot process images right now (fails closed; nothing is stored). Retry later.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: '`server_error` — generic; also returned for every request when the server is misconfigured (e.g. weak `JWT_SECRET`), and for media requests when `MEDIA_SIGNING_SECRET` is missing or weak.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    LoginSession:
      type: object
      additionalProperties: false
      required: [id, is_current, device_label, os_version, app_version, ip_address, location_label, location_updated_at, created_at, last_seen_at]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        is_current: {type: boolean}
        device_label: {type: string}
        os_version: {type: string}
        app_version: {type: string}
        ip_address: {type: string, description: Server-observed last connection address; may be a hosting proxy or VPN.}
        location_label: {type: [string, 'null']}
        location_updated_at: {type: [string, 'null'], description: UTC datetime of last explicit label update.}
        created_at: {type: string, description: "UTC session record datetime. New logins use actual login time; migrated sessions use the earliest surviving live refresh credential timestamp."}
        last_seen_at: {type: string, description: UTC activity datetime, throttled to one update/minute.}
    GroupInvitation:
      type: object
      required: [id, group_id, recipient_id, group_name, inviter_name, status, expires_at, approval_required]
      properties:
        id: {type: integer}
        group_id: {type: integer}
        recipient_id: {type: integer}
        group_name: {type: string}
        inviter_name: {type: string}
        status: {type: string, enum: [pending, accepted, declined, expired]}
        expires_at: {type: string, description: UTC MySQL datetime, optionally with microseconds.}
        approval_required: {type: boolean}
    GroupInvitationResponse:
      type: object
      properties:
        success: {const: true}
        data:
          type: object
          required: [invitation]
          properties:
            invitation: {$ref: '#/components/schemas/GroupInvitation'}
            status: {type: string, enum: [joined, pending_approval, accepted, declined, expired]}
    PushGroupReportEnvelope:
      type: object
      additionalProperties: false
      required: [event_id, type, api_base_url, recipient_id, session_scope, group_id, expires_at]
      properties:
        event_id: {type: string, pattern: '^[a-f0-9]{64}$'}
        type: {type: string, const: group.report}
        api_base_url: {type: string, format: uri}
        recipient_id: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
        session_scope: {type: string, pattern: '^[a-f0-9]{64}$'}
        group_id: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
        expires_at: {type: string, pattern: '^[0-9]{1,13}$'}
    PushGroupInvitationEnvelope:
      type: object
      additionalProperties: false
      description: |
        Data-only reference envelope with no contact details or private text. Same trusted API,
        recipient/session/expiry/dedup checks as PushMemoryEnvelope. Resolve through recipient-owned
        invitation API before display or navigation. Non-members may receive invitations, never
        Memory access. Worker rechecks pending state, expiry, permission, bans, parent membership,
        session and saved groups notification preferences. Native delivery remains device-dependent.
      required: [event_id, type, api_base_url, recipient_id, session_scope, group_id, invitation_id, expires_at]
      properties:
        event_id: {type: string, pattern: '^[a-f0-9]{64}$'}
        type: {type: string, const: group.invitation}
        api_base_url: {type: string, format: uri, pattern: '^https://'}
        recipient_id: {type: string, pattern: '^[1-9][0-9]*$'}
        session_scope: {type: string, pattern: '^[a-f0-9]{64}$'}
        group_id: {type: string, pattern: '^[1-9][0-9]*$'}
        invitation_id: {type: string, pattern: '^[1-9][0-9]*$'}
        expires_at: {type: string, pattern: '^[0-9]+$'}
    PushMemoryEnvelope:
      type: object
      additionalProperties: false
      description: |
        FCM data-only payload. Contains references, never private text, names, media URLs,
        bearer tokens or a provider-controlled route. Client must verify canonical API URL,
        current recipient and SHA-256 of its JWT sid against session_scope, expiry,
        supported type and deduplication before displaying or routing. Dedup keys must
        include the trusted API base URL, recipient, session_scope and event_id; IDs
        can repeat across recipients/deployments. Compare with the configured API URL
        first; never send credentials to a URL selected by an incoming payload.
        Fetch the Memory through its authorized API; inaccessible/deleted content gets a
        calm fallback. Data-only normal-priority Android delivery is not a guarantee of
        background/terminated delivery or visible notification display. No native validation claimed.
      required: [event_id, type, api_base_url, recipient_id, session_scope, group_id, memory_id, comment_id, expires_at]
      properties:
        event_id: { type: string, pattern: '^[a-f0-9]{64}$', description: Stable SHA-256 of the committed event key, unchanged across device retries. }
        type: { type: string, enum: [memory.created, comment.created, comment.reply] }
        api_base_url: { type: string, format: uri, maxLength: 512, pattern: '^https://' }
        recipient_id: { type: string, pattern: '^[1-9][0-9]*$' }
        session_scope: { type: string, pattern: '^[a-f0-9]{64}$', description: SHA-256 of login session id; not an authentication credential. }
        group_id: { type: string, pattern: '^[1-9][0-9]*$' }
        memory_id: { type: string, pattern: '^[1-9][0-9]*$' }
        comment_id: { type: string, pattern: '^([1-9][0-9]*)?$' }
        expires_at: { type: string, pattern: '^[0-9]+$', description: UTC Unix expiry in seconds; ignore after this time. }
    PushDeviceToken:
      type: object
      required: [fcm_token]
      properties:
        fcm_token: { type: string, minLength: 1, maxLength: 512, pattern: '^[A-Za-z0-9:_-]+$' }
    PushDeviceRegistration:
      allOf:
        - $ref: '#/components/schemas/PushDeviceToken'
        - type: object
          required: [platform]
          properties:
            platform: { type: string, enum: [android, ios] }
    PushCategories:
      type: object
      additionalProperties: false
      properties:
        memories: { type: boolean, default: false }
        replies_reactions: { type: boolean, default: false }
        groups: { type: boolean, default: false }
        chats: { type: boolean, default: false }
        events: { type: boolean, default: false }
        polls: { type: boolean, default: false }
        albums: { type: boolean, default: false }
        security: { type: boolean, default: false }
    CompletePushCategories:
      allOf:
        - $ref: '#/components/schemas/PushCategories'
        - type: object
          required: [memories, replies_reactions, groups, chats, events, polls, albums, security]
    NotificationPreferencePatch:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean, default: false }
        categories: { $ref: '#/components/schemas/PushCategories' }
        quiet_hours: { type: boolean, default: true }
        quiet_start: { type: integer, minimum: 0, maximum: 1439, default: 1320 }
        quiet_end: { type: integer, minimum: 0, maximum: 1439, default: 420 }
        timezone: { type: string, maxLength: 64, default: UTC, description: Valid IANA timezone identifier. }
    NotificationPreferences:
      type: object
      required: [enabled, categories, quiet_hours, quiet_start, quiet_end, timezone]
      properties:
        enabled: { type: boolean, default: false }
        categories: { $ref: '#/components/schemas/CompletePushCategories' }
        quiet_hours: { type: boolean, default: true }
        quiet_start: { type: integer, minimum: 0, maximum: 1439, default: 1320 }
        quiet_end: { type: integer, minimum: 0, maximum: 1439, default: 420 }
        timezone: { type: string, maxLength: 64, default: UTC, description: Valid IANA timezone identifier. }
    Success:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: {}
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: Human-readable; may change. Clients branch on `code`. }
            details: { type: object, additionalProperties: true }
    ErrorCode:
      type: string
      enum:
        - validation_error
        - invalid_cursor
        - unauthorized
        - invalid_token
        - invalid_credentials
        - invalid_current_password
        - account_inactive
        - forbidden
        - not_member
        - not_found
        - member_not_found
        - owner_protected
        - last_admin
        - subgroup_handover_required
        - depth_limit
        - already_member
        - not_parent_member
        - join_not_allowed
        - link_revoked
        - link_expired
        - link_exhausted
        - conflict
        - rate_limited
        - server_error
        - media_too_large
        - media_type_not_allowed
        - media_invalid
        - media_limit_reached
        - upload_expired
        - media_link_invalid
    Mobile:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      description: E.164 with country code. Syntax only; ownership is not verified (no OTP yet).
    Password:
      type: string
      minLength: 15
      maxLength: 128
      description: Unicode characters, spaces allowed, used exactly as sent.
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds. }
    Me:
      type: object
      description: Owner-only account details. Display name and bio also appear in existing group member views; other personal fields are private.
      properties:
        id: { type: integer }
        mobile: { type: string, readOnly: true, description: 'Own mobile only; number changes require a separate verified flow.' }
        display_name: { type: string, maxLength: 100 }
        about: { type: string, maxLength: 500 }
        current_city: { type: string, maxLength: 100 }
        hometown: { type: string, maxLength: 100 }
        work: { type: string, maxLength: 100 }
        education: { type: string, maxLength: 150 }
        avatar_path: { type: 'null', deprecated: true, description: 'Legacy field; always null. Private storage paths are never returned.' }
        avatar_version: { type: [string, 'null'], format: uuid, description: 'Opaque current avatar revision, not a URL or authorization credential.' }
        cover_version: { type: [string, 'null'], format: uuid, description: 'Opaque current cover revision, not a URL or authorization credential.' }
        created_at: { type: string }
    Role:
      type: string
      enum: [admin, member]
      description: The owner is identified by `owner_user_id` and is always an admin.
    GroupType:
      type: string
      enum: [family, friends, school, college, office, club, other]
      default: other
    Visibility:
      type: string
      enum: [listed, hidden]
      default: listed
      description: Hidden subgroups are not listed to members of the parent.
    ApprovalMode:
      type: string
      enum: [auto, manual]
      default: auto
    GroupSummary:
      type: object
      properties:
        id: { type: integer }
        parent_id: { type: [integer, 'null'] }
        root_id: { type: [integer, 'null'] }
        depth: { type: integer, minimum: 1, maximum: 10 }
        type: { $ref: '#/components/schemas/GroupType' }
        name: { type: string }
        avatar_version: {type: [string, 'null'], format: uuid, description: Opaque private group picture revision on authorized list/detail responses.}
        cover_version: {type: [string, 'null'], format: uuid, description: Opaque private banner revision on authorized list/detail responses.}
        description: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        approval_mode: { $ref: '#/components/schemas/ApprovalMode' }
        owner_user_id: { type: integer }
        created_at: { type: string }
    Group:
      allOf:
        - $ref: '#/components/schemas/GroupSummary'
        - type: object
          properties:
            cover_path: { type: [string, 'null'] }
            link_sharing: { type: string, enum: [admins, members] }
            event_creation: { type: string, enum: [members, admins] }
            updated_at: { type: string }
    Member:
      type: object
      properties:
        id: { type: integer }
        display_name: { type: string }
        about: { type: string }
        avatar_path: { type: 'null', description: Legacy private paths are never exposed. }
        avatar_version: { type: [string, 'null'], format: uuid, description: Optional opaque photo revision for active exact members; never a URL or credential. }
        role: { $ref: '#/components/schemas/Role' }
        is_owner: { type: boolean }
        joined_at: { type: [string, 'null'] }
    OffsetPagination:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    CursorPagination:
      type: object
      properties:
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
        limit: { type: integer }
    NewInviteLink:
      type: object
      properties:
        id: { type: integer }
        token: { type: string, description: Shown once; only a SHA-256 hash is stored. }
        expires_at: { type: string }
        max_uses: { type: [integer, 'null'] }
        link: { type: string, examples: ['/i/<token>'] }
    InviteLinkInfo:
      type: object
      properties:
        id: { type: integer }
        created_by: { type: integer }
        created_by_name: { type: string }
        created_at: { type: string }
        expires_at: { type: [string, 'null'] }
        max_uses: { type: [integer, 'null'] }
        use_count: { type: integer }
        revoked_at: { type: [string, 'null'] }
        status: { type: string, enum: [active, expired, exhausted, revoked] }
    JoinRequest:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        status: { type: string, const: pending }
        message: { type: string }
        created_at: { type: string }
        display_name: { type: string }
        avatar_path: { type: [string, 'null'] }
    Emoji:
      type: string
      enum: ['❤️', '😂', '😮', '😢', '🙏', '👍', '🎉', '🔥']
      default: '❤️'
    Memory:
      type: object
      properties:
        id: { type: integer }
        group_id: { type: integer }
        author_id: { type: integer }
        body: { type: string, description: 'May be empty ("") when the Memory has photos.' }
        memory_date: { type: [string, 'null'], format: date }
        place: { type: [string, 'null'] }
        created_at: { type: string }
        updated_at: { type: string }
        author_name: { type: string }
        author_avatar: { type: [string, 'null'] }
        group_name: { type: string }
        group_type: { $ref: '#/components/schemas/GroupType' }
        media:
          type: array
          maxItems: 10
          description: |
            Photos in display order (empty for text-only Memories). Ids and pixel size
            (upright, after orientation) only — never URLs or storage paths; ask
            `GET /media/{mediaId}` for a signed link. Hidden or deleted photos are left out.
          items: { $ref: '#/components/schemas/MemoryMedia' }
    MemoryMedia:
      type: object
      required: [id, width, height]
      properties:
        id: { type: string, format: uuid }
        width: { type: integer }
        height: { type: integer }
    MemoryListItem:
      allOf:
        - $ref: '#/components/schemas/Memory'
        - type: object
          properties:
            reaction_count: { type: integer }
            comment_count: { type: integer }
            user_reacted: { type: boolean }
            user_saved: { type: boolean }
    Comment:
      type: object
      properties:
        id: { type: integer }
        parent_id: { type: [integer, 'null'] }
        author_id: { type: integer }
        body: { type: string }
        created_at: { type: string }
        author_name: { type: string }
        author_avatar: { type: [string, 'null'] }
    MediaUploadTicket:
      type: object
      description: ADR 0007. The `upload_id` is also the future media id.
      properties:
        upload_id: { type: string, format: uuid }
        upload_path: { type: string, description: 'Path for the PUT, relative to the API base: /media/uploads/{uploadId}/content.' }
        expires_at: { type: string, description: UTC; 15 minutes after creation. }
        max_bytes: { type: integer, description: The announced `byte_size`; the PUT body must be exactly this long. }
    MediaAsset:
      type: object
      description: ADR 0007. Never contains a storage path or URL.
      properties:
        id: { type: string, format: uuid }
        group_id: { type: integer }
        uploader_id: { type: integer }
        kind: { type: string, enum: [image] }
        mime_type: { type: string, description: 'Stored type once ready (image/webp, or image/jpeg); the announced type before.' }
        width: { type: [integer, 'null'], description: 'Pixel width after orientation; null until ready.' }
        height: { type: [integer, 'null'] }
        byte_size: { type: integer, description: 'Bytes of the stored `full` size once ready; the announced size before.' }
        status: { type: string, enum: [pending, ready, failed, deleted] }
        sizes: { type: array, items: { type: string, enum: [thumb, medium, full] } }
        created_at: { type: string }
    SignedMediaLink:
      type: object
      description: ADR 0007.
      properties:
        url: { type: string, description: 'Signed path relative to the API base, e.g. /media/files/{id}/medium?expires=1792758951&sig=<64 hex>. No bearer token needed.' }
        expires_at: { type: string, description: UTC; `MEDIA_LINK_TTL` seconds (default 300) after issue. }
        width: { type: integer, description: Pixel width of this size. }
        height: { type: integer }
        mime_type: { type: string }
